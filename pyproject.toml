[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climatewatches"
version = "1.0.0"
description = "Climate data monitoring and visualization for temporal and spatial dataset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Andriamihaja R.", email = "andriamihajaranaivoson@yahoo.fr"}
]
keywords = ["climate", "meteorology", "rainfall", "temperature", "cyclone", "climatewatches"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "cartopy",
    "geopandas",
    "geopy",
    "matplotlib",
    "netCDF4",
    "numpy",
    "pandas",
    "rasterio",
    "rioxarray",
    "scipy",
    "shapely",
    "xarray",
]

[project.urls]
Homepage = "https://github.com/Dihj/climatewatches"
Repository = "https://github.com/Dihj/climatewatches"
Issues = "https://github.com/Dihj/climatewatches/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["climatewatches*"]
